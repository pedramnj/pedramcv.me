name: Deploy

# Builds the static export off-box and rsyncs it to the origin server.
# The constrained box never builds — it only serves files.
#
# Required repository secrets:
#   SSH_PRIVATE_KEY  – deploy key authorized on the server
#   SSH_HOST         – e.g. 46.225.157.97
#   SSH_USER         – e.g. deploy
#   DEPLOY_PATH      – e.g. /var/www/pedramcv

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync static export → server
        # The deploy key is locked to `rrsync -wo /var/www/pedramcv` on the box, so
        # it can ONLY rsync into the web root. Skip -p/-o/-g: the deploy user can't
        # chown, and its umask already yields nginx-readable 644/755.
        run: |
          rsync -rltvz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            out/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"
