# Local container run of the production image.
#   docker compose up --build   →   http://localhost:8088
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/pedramnj/pedramcv:latest
    ports:
      - "8088:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
