# nginx vhost for pedramcv.me on the origin server.
# Serves the static export from /var/www/pedramcv. TLS managed by certbot.
server {
    listen 80;
    listen [::]:80;
    server_name pedramcv.me www.pedramcv.me;

    root /var/www/pedramcv;
    index index.html;

    # Clean URLs from Next.js static export (trailingSlash: true).
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Content-hashed assets — cache aggressively.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    error_page 404 /404.html;
}
