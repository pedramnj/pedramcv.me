# nginx vhost for pedramcv.me on the origin server.
# Serves the Next.js static export from /var/www/pedramcv.
# The domain sits behind Cloudflare; "Full" mode connects to the 443 block below.

# --- HTTP (also serves Cloudflare "Flexible" mode + ACME challenges) ---
server {
    listen 80;
    listen [::]:80;
    server_name pedramcv.me www.pedramcv.me;

    root /var/www/pedramcv;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pedramcv;
    }

    # GitHub Actions playground proxy (holds the scoped token; never the browser).
    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    error_page 404 /404.html;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}

# --- HTTPS (Cloudflare "Full" / "Full (strict)" connects here) ---
# Cert: Cloudflare Origin Certificate (free, 15-year, trusted by Cloudflare's
# edge only). Works with both "Full" and "Full (strict)". Renew before 2041.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pedramcv.me www.pedramcv.me;

    ssl_certificate     /etc/nginx/ssl/pedramcv/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/pedramcv/key.pem;

    root /var/www/pedramcv;
    index index.html;

    # GitHub Actions playground proxy (holds the scoped token; never the browser).
    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    error_page 404 /404.html;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
}
